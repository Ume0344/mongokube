---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - mongokube.wrd.parrot.com
  resources:
  - mongokubes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mongokube.wrd.parrot.com
  resources:
  - mongokubes/finalizers
  verbs:
  - update
- apiGroups:
  - mongokube.wrd.parrot.com
  resources:
  - mongokubes/status
  verbs:
  - get
  - patch
  - update
