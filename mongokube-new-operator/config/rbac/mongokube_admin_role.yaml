# This rule is not used by the project mongokube-new-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over mongokube.wrd.parrot.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mongokube-new-operator
    app.kubernetes.io/managed-by: kustomize
  name: mongokube-admin-role
rules:
- apiGroups:
  - mongokube.wrd.parrot.com
  resources:
  - mongokubes
  verbs:
  - '*'
- apiGroups:
  - mongokube.wrd.parrot.com
  resources:
  - mongokubes/status
  verbs:
  - get
