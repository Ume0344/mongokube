# This rule is not used by the project mongokube-new-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to mongokube.wrd.parrot.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mongokube-new-operator
    app.kubernetes.io/managed-by: kustomize
  name: mongokube-viewer-role
rules:
- apiGroups:
  - mongokube.wrd.parrot.com
  resources:
  - mongokubes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mongokube.wrd.parrot.com
  resources:
  - mongokubes/status
  verbs:
  - get
